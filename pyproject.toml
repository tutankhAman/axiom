[project]
name = "axiom"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
# EnergyPlus Python API (pyenergyplus) is provided via system installation or pyenergyplus-lbnl package
dependencies = [
    "pyenergyplus-lbnl>=26.1.0; sys_platform == 'never'",  # fallback marker / system install documentation
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.11"

[dependency-groups]
dev = [
    "lefthook>=2.1.10",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: Mark test as integration test requiring EnergyPlus installation",
]

