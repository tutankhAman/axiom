pre-commit:
  commands:
    ruff-check:
      glob: "*.py"
      run: uv run ruff check {staged_files}
      stage_fixed: true
    ruff-format:
      glob: "*.py"
      run: uv run ruff format --check {staged_files}
    ty-check:
      run: uv run ty check

pre-push:
  commands:
    ruff-check:
      glob: "*.py"
      run: uv run ruff check .
    ty-check:
      run: uv run ty check

